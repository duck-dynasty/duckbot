# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 100
  ignore:
  - dependency-name: davey  # 0.2.0 is silent on discord.py 2.7.1: Rapptz/discord.py#10548
    versions: ["0.2.0"]
- package-ecosystem: github-actions
  directories:
  - /
  - /.github/actions/build-push-docker-image/
  - /.github/actions/setup-aws-cdk/
  - /.github/actions/setup-python-venv/
  schedule:
    interval: monthly
  open-pull-requests-limit: 100
- package-ecosystem: docker
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 100
- package-ecosystem: docker-compose
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 100
